apiVersion: v1
kind: Service
metadata:
    name: "{{ default "meshery-practice-frontend" .Values.frontend.name }}-service"
    labels:
        obj: service
        app: {{ default "meshery-practice-frontend" .Values.frontend.labels.app}}
spec:
    selector:
        obj: pod
        app: {{ default "meshery-practice-frontend" .Values.frontend.labels.app }}
    ports:
    - port: {{ default 3000 .Values.frontend.service.externalPort }}
      targetPort: {{ default 3000 .Values.frontend.service.internalPort | int }}
      protocol: "TCP"
    type: {{ default "ClusterIP" .Values.frontend.service.type }}